version: '3.8'

services:
  # PostgreSQL database with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gasgen_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-gasgen}
      POSTGRES_USER: ${DB_USER:-gasgen_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gasgen_secure_pass}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db_analytics_schema.sql:/docker-entrypoint-initdb.d/02_analytics.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gasgen_user} -d ${DB_NAME:-gasgen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gasgen_network

  # GasGen Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasgen_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KIE_API_KEY: ${KIE_API_KEY:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gasgen}
      DB_USER: ${DB_USER:-gasgen_user}
      DB_PASSWORD: ${DB_PASSWORD:-gasgen_secure_pass}
      CHROMA_DIR: /app/data/chroma_db
      DATA_DIR: /app/data/higgsfield_data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot_data:/app/data
      - ./bot:/app/bot:ro
    restart: unless-stopped
    networks:
      - gasgen_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gasgen_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gasgen.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - gasgen_network
    profiles:
      - admin

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: gasgen_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    networks:
      - gasgen_network
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: gasgen_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped
    networks:
      - gasgen_network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  bot_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  gasgen_network:
    driver: bridge
